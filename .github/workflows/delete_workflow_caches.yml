name: Delete workflow caches

on:
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          The ref whose caches to delete, e.g. 'refs/heads/my-branch' or just 'my-branch';
          every cache of the repository if left empty
        type: string
        default: ''
        required: false
  pull_request_target:
    types:
      - closed
  delete: {}

permissions:
  actions: write

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request_target'
    && github.event.pull_request.number
    || github.event_name == 'delete'
    && format('refs/heads/{0}', github.event.ref)
    || inputs.ref || github.ref }}

jobs:
  delete-workflow-caches:
    name: Delete the workflow caches
    if: github.event_name != 'delete' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Delete the caches
        uses: actions/github-script@v9
        env:
          CACHE_REF: >-
            ${{ github.event_name == 'delete'
            && format('refs/heads/{0}', github.event.ref)
            || github.event_name == 'pull_request_target'
            && format('refs/pull/{0}/merge', github.event.pull_request.number)
            || inputs.ref }}
        with:
          script: |
            const input = process.env.CACHE_REF;
            const ref = input && !input.startsWith('refs/')
              ? `refs/heads/${input}`
              : input;
            if (ref !== input) {
              core.info(`Interpreted '${input}' as the branch ref '${ref}'.`);
            }
            const scope = ref ? `for ${ref}` : 'in the repository';

            const caches = await github.paginate(
              github.rest.actions.getActionsCacheList,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ...(ref ? { ref } : {}),
              },
              (response) => response.data
            );

            core.info(`Found ${caches.length} cache entries ${scope}.`);

            const undeleted = [];
            for (const cache of caches) {
              try {
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                });
                core.info(`Deleted cache id ${cache.id} (${cache.key}).`);
              } catch (error) {
                if (error.status === 404) {
                  core.info(`Cache id ${cache.id} (${cache.key}) was already deleted.`);
                } else {
                  undeleted.push(cache);
                  core.error(`Could not delete cache id ${cache.id}: ${error.message}`);
                }
              }
            }

            if (undeleted.length > 0) {
              core.setFailed(
                `Could not delete ${undeleted.length} of ${caches.length} cache entries.`
              );
            }
