name: Build for different runners

on:
  push:
    branches:
      - master
  pull_request: {}
  workflow_dispatch: {}

# Cancel superseded runs, but never on master: that is the branch whose ccache entries every
# other branch and pull request restores from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Nothing here writes through the API, but every job runs cmake, mvnw, package managers and
# third-party actions, so do not hand them the read-write repository default.
permissions:
  contents: read

jobs:
  build-native:
    name: Build on ${{ matrix.os }} for jdk${{ matrix.java-version }}
    strategy:
      fail-fast: false
      matrix:
        java-version:
          - 17
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
          - macos-26
          - windows-2025
        include:
          - os: ubuntu-24.04
            java-version: 21
          - os: ubuntu-24.04
            java-version: 25

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "true"

      # Of a runner's jdk jobs only the jdk17 one writes the compiler cache: the jdk version
      # affects the SWIG wrapper translation unit alone. Keep in step with the matrix above.
      - name: Build native library for ${{ matrix.os }} and jdk${{ matrix.java-version }}
        uses: ./.github/actions/build_native_library
        with:
          runner-name: ${{ matrix.os }}
          java-version: ${{ matrix.java-version }}
          save-ccache: ${{ matrix.java-version == 17 }}
          gpg-secret-key: ${{ secrets.GPG_SECRET_KEY }}
          gpg-secret-key-password: ${{ secrets.GPG_SECRET_KEY_PASSWORD }}

  # One stable context for branch protection. The matrix names encode the runner label and the
  # jdk version, so requiring them by name means mirroring every matrix edit in the repository
  # settings - and a leg added there and forgotten here is simply not required.
  #
  # 'if: always()' is what makes this a gate rather than a summary: without it a failing leg
  # skips the job, and a skipped required check counts as neutral. A run cancelled by the
  # concurrency group reports 'cancelled' and blocks, which is correct.
  native-libraries-gate:
    needs: [build-native]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check every leg succeeded
        env:
          RESULT: ${{ needs.build-native.result }}
        run: |
          echo "build-native: ${RESULT}"
          [ "${RESULT}" = "success" ] || exit 1
