# The globbed directories cover both the workflows and every nested composite action, so one entry
# is enough and actions used in several places yield a single pull request. Minor and patch bumps
# are grouped; majors stay separate so a breaking update can be reviewed and reverted on its own.
version: 2
updates:

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/**"
    schedule:
      interval: "daily"
      time: "01:00"
      timezone: "Europe/Berlin"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "maven"
    directory: "/java"
    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "Europe/Berlin"
    # central-publishing-maven-plugin 0.11.0 bundles the maven-metadata-local.xml that Maven 3.10
    # writes into its staging directory, and Central rejects the release bundle.
    ignore:
      - dependency-name: "org.apache.maven:apache-maven"
        versions: [">= 3.10.0"]
