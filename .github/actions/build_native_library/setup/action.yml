name: Setup of the needed software
description: Setup of the needed software

inputs:
  runner-name:
    description: The runner name to be used for ccache key name
    default: ''
    required: true
  java-version:
    description: The java jdk version to setup
    default: ''
    required: true
  save-ccache:
    description: Whether this job writes the compiler cache when it runs on master
    default: 'true'
    required: false
  gpg-secret-key:
    description: The gpg secret key
    default: ''
    required: true

runs:
  using: composite
  steps:
    - name: Check if runner-name variable is Set
      if: inputs.runner-name == ''
      shell: bash
      run: |
        echo "The variable 'runner-name' was not set"
        exit 1

    - name: Setup Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache ninja-build
        sudo apt-get remove -y cmake swig swig4.0

        brew_shellenv="$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        eval "${brew_shellenv}"

        brew update
        brew install boost cmake swig

    - name: Setup macOs
      if: runner.os == 'macOs'
      shell: bash
      run: |
        installed_taps="$(brew tap)"
        for tap in aws/tap hashicorp/tap; do
          if grep -qxF "${tap}" <<< "${installed_taps}"; then
            brew untap --force "${tap}"
          fi
        done

        brew update

        formulae="boost cmake ninja swig"

        missing=""
        for formula in ${formulae}; do
          if ! brew list --formula --versions "${formula}" > /dev/null 2>&1; then
            missing="${missing} ${formula}"
          fi
        done
        if [ -n "${missing}" ]; then
          brew install --formula ${missing}
        fi

        outdated="$(brew outdated --formula --quiet ${formulae} || true)"
        if [ -n "${outdated}" ]; then
          brew upgrade --formula ${outdated}
        fi

    - name: Check the toolchain matches the versions CMakeLists.txt pins
      if: runner.os != 'Windows'
      shell: bash
      run: |
        read_pin() {
          sed -n "s/.*${1} \"\([^\"]*\)\".*/\1/p" "${GITHUB_WORKSPACE}/CMakeLists.txt"
        }

        mismatch=""

        boost_want="$(read_pin QL_MVN_BOOST_VERSION)"
        boost_have="$(brew list --versions boost | awk '{ print $2 }' | cut -d '_' -f 1 || true)"
        if [ -z "${boost_have}" ]; then
          mismatch="${mismatch} boost (not installed, pinned ${boost_want})"
        elif [ "${boost_want}" != "${boost_have}" ]; then
          mismatch="${mismatch} boost (installed ${boost_have}, pinned ${boost_want})"
        fi

        swig_want="$(read_pin QL_MVN_SWIG_VERSION)"
        swig_have="$(swig -version | awk '/SWIG Version/ { print $3 }' || true)"
        if [ -z "${swig_have}" ]; then
          mismatch="${mismatch} swig (not on PATH, pinned ${swig_want})"
        elif [ "${swig_want}" != "${swig_have}" ]; then
          mismatch="${mismatch} swig (installed ${swig_have}, pinned ${swig_want})"
        fi

        if [ -n "${mismatch}" ]; then
          message="Homebrew does not match CMakeLists.txt:${mismatch}."
          message="${message} Bump QL_MVN_BOOST_VERSION / QL_MVN_SWIG_VERSION in CMakeLists.txt,"
          message="${message} or merge the pull request bump_toolchain_versions.yml opened."
          echo "::error::${message}"
          exit 1
        fi

    - name: Restore the cached Boost installer on Windows
      id: cache-boost-installer
      if: runner.os == 'Windows'
      uses: actions/cache@v6
      with:
        path: ${{ env.BOOST_INSTALLER_PATH }}
        key: boost-installer-${{ env.BOOST_DOWNLOAD_URI }}

    - name: Restore the cached SWIG archive on Windows
      id: cache-swig-archive
      if: runner.os == 'Windows'
      uses: actions/cache@v6
      with:
        path: ${{ env.SWIG_ZIP_FILE_PATH }}
        key: swig-archive-${{ env.SWIG_DOWNLOAD_URI }}

    - name: Setup Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        function Invoke-DownloadWithRetry {
            param(
                [Parameter(Mandatory = $true)] [string] $Uri,
                [Parameter(Mandatory = $true)] [string] $Destination
            )

            $maxAttempts = 3
            for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
                try {
                    Write-Host "Downloading $Uri (attempt $attempt of $maxAttempts)"
                    Start-BitsTransfer -Source $Uri -Destination $Destination `
                        -RetryInterval 60 -RetryTimeout 300 -ErrorAction Stop
                    return
                }
                catch {
                    Write-Warning "Downloading $Uri failed: $($_.Exception.Message)"
                    Remove-Item -Path $Destination -Force -ErrorAction SilentlyContinue
                    if ($attempt -eq $maxAttempts) {
                        throw
                    }
                    Start-Sleep -Seconds (30 * $attempt)
                }
            }
        }

        if ('${{ steps.cache-boost-installer.outputs.cache-hit }}' -ne 'true') {
            Invoke-DownloadWithRetry -Uri $env:BOOST_DOWNLOAD_URI `
                -Destination $env:BOOST_INSTALLER_PATH
        }

        $boostInstall = Start-Process -Wait -PassThru -FilePath "$env:BOOST_INSTALLER_PATH" `
            -ArgumentList "/SILENT","/SP-","/SUPPRESSMSGBOXES","/DIR=$env:BOOST_INSTALL_DIR"
        if ($boostInstall.ExitCode -ne 0) {
            throw "The Boost installer failed with exit code $($boostInstall.ExitCode)"
        }

        if ('${{ steps.cache-swig-archive.outputs.cache-hit }}' -ne 'true') {
            Invoke-DownloadWithRetry -Uri $env:SWIG_DOWNLOAD_URI `
                -Destination $env:SWIG_ZIP_FILE_PATH
        }
        Expand-Archive -Force $env:SWIG_ZIP_FILE_PATH $env:RUNNER_TEMP

        swig -version
        if ($LASTEXITCODE -ne 0) {
            throw "'swig -version' failed with exit code $LASTEXITCODE"
        }

        choco install -y cmake ninja

    - name: Set up JDK ${{ inputs.java-version }}
      uses: ./.github/actions/build_native_library/setup/jdk
      with:
        java-version:   ${{ inputs.java-version }}
        gpg-secret-key: ${{ inputs.gpg-secret-key }}

    - name: Setup CCache
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        variant: ${{ env.CMAKE_CXX_COMPILER_LAUNCHER }}
        key: ${{ runner.os }}-${{ inputs.runner-name }}-${{ runner.arch }}
        restore-keys: ${{ runner.os }}-${{ inputs.runner-name }}-${{ runner.arch }}
        max-size: 250M
        evict-old-files: 7d
        save: ${{ github.ref == 'refs/heads/master' && inputs.save-ccache == 'true' }}

    - name: Set up Visual Studio shell on Windows
      uses: TheMrMilchmann/setup-msvc-dev@v4
      if: runner.os == 'Windows'
      with:
        arch: x64
