name: Setup JDK
description: Setup JDK

inputs:
  java-version:
    description: The java jdk version to setup
    default: ''
    required: true
  gpg-secret-key:
    description: The gpg secret key
    default: ''
    required: true

runs:
  using: composite
  steps:
    - name: Check if java-version variable is Set
      if: inputs.java-version == ''
      shell: bash
      run: |
        echo "The variable 'java-version' was not set"
        exit 1

    - name: Warn if gpg-secret-key variable is not Set
      if: inputs.gpg-secret-key == ''
      shell: bash
      run: |
        echo "::warning::The variable 'gpg-secret-key' was not set; skipping the gpg key import"

    - uses: actions/setup-java@v6
      if: env.JAVA_IS_SETUP != inputs.java-version
      with:
        java-version:            ${{ inputs.java-version }}
        distribution:            "temurin"
        server-id:               central
        server-username-env-var: MAVEN_CENTRAL_USERNAME
        server-password-env-var: MAVEN_CENTRAL_PASSWORD
        gpg-private-key:         ${{ inputs.gpg-secret-key }}
        gpg-passphrase-env-var:  MAVEN_GPG_PASSPHRASE
        cache:                   maven

    - name: Remember which jdk version is set up
      shell: bash
      env:
        JAVA_VERSION: ${{ inputs.java-version }}
      run: |
        echo "JAVA_IS_SETUP=${JAVA_VERSION}" >> "$GITHUB_ENV"
